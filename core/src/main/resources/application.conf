# Configuration du moteur de validation du NIST (Typesafe Config), lue par lui seul : Spring Boot
# ignore ce fichier. Elle complete le reference.conf du moteur.
#
# Un depassement de longueur est une erreur, comme pour HAPI ; le moteur en fait par defaut un
# avertissement.
report.length.classification = ${report.classification.error}

# Un element sans longueur dans le profil n'a pas de longueur a controler : ce n'est pas une
# anomalie du message. Les variantes PRT 2.9 de l'export IGAMT CI-SIS ORU n'en declarent pas, et
# le moteur en ferait par defaut une « Specification Error » par element.
report.length-spec-error-no-valid.classification = ${report.classification.informational}
