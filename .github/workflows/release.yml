# Builds the OIE extension and publishes it as a GitHub Release on tag vX.Y.Z.
# A manual run (workflow_dispatch) builds and uploads the extension archive as an artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  OIE_VERSION: 4.7.0
  OIE_SHA256: ab08558873dc6be1e474afaacc46efe94d29c945cd3381c10d0ae548ecb429de

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # OIE APIs are not published on Maven Central: extract them from the official release archive.
      - name: Restore provided OIE jars
        id: jars
        uses: actions/cache@v4
        with:
          path: provided-jars
          key: provided-jars-oie-${{ env.OIE_VERSION }}

      - name: Download provided OIE jars
        if: steps.jars.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p provided-jars dl
          curl -fsSL --retry 3 -o dl/oie.tar.gz \
            "https://github.com/OpenIntegrationEngine/engine/releases/download/v${OIE_VERSION}/oie_unix_${OIE_VERSION//./_}.tar.gz"
          echo "${OIE_SHA256}  dl/oie.tar.gz" | sha256sum -c -
          tar xzf dl/oie.tar.gz -C dl \
            oie/server-lib/mirth-server.jar \
            oie/server-lib/mirth-client-core.jar \
            oie/server-lib/donkey/donkey-model.jar \
            oie/server-lib/donkey/donkey-server.jar
          cp dl/oie/server-lib/mirth-server.jar provided-jars/server-api.jar
          cp dl/oie/server-lib/mirth-client-core.jar provided-jars/client-core.jar
          cp dl/oie/server-lib/donkey/donkey-model.jar provided-jars/donkey-model.jar
          cp dl/oie/server-lib/donkey/donkey-server.jar provided-jars/donkey-server.jar
          rm -rf dl

      - name: Install provided OIE jars
        run: |
          set -euo pipefail
          for a in server-api donkey-model donkey-server client-core; do
            mvn -B -ntp -q install:install-file -Dfile="provided-jars/${a}.jar" \
              -DgroupId=com.mirth.connect -DartifactId="${a}" -Dversion="${OIE_VERSION}" -Dpackaging=jar
          done

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: mvn -B -ntp -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B -ntp package

      - uses: actions/upload-artifact@v4
        with:
          name: hl7v2-validation
          path: plugin/target/hl7v2-validation-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd plugin/target
          sha256sum hl7v2-validation-*.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" hl7v2-validation-*.zip SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
